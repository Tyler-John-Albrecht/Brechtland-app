<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brechtland — Email Marketing Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; background: #f3f5f8; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    input, select, textarea, button { font-family: inherit; }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API = 'https://brechtland-receptionist-production.up.railway.app';
    const EM_PURPLE = '#7C3AED';

    function getToken() {
      return new URLSearchParams(window.location.search).get('token') || '';
    }

    async function portalFetch(path, options = {}) {
      const token = getToken();
      const sep = path.includes('?') ? '&' : '?';
      const res = await fetch(API + '/api/v1/em/portal' + path + sep + 'token=' + encodeURIComponent(token), {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        body: options.body ? JSON.stringify(options.body) : undefined,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    // ─── Shared UI ────────────────────────────────────────
    const Spinner = () => (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 48 }}>
        <div style={{ width: 32, height: 32, border: '3px solid #e8ecf1', borderTopColor: EM_PURPLE, borderRadius: '50%', animation: 'spin 0.7s linear infinite' }} />
      </div>
    );

    const Badge = ({ label, color = '#6b7280' }) => (
      <span style={{ display: 'inline-flex', alignItems: 'center', fontSize: 11, fontWeight: 600, padding: '3px 10px', borderRadius: 100, color, background: color + '18', textTransform: 'capitalize', letterSpacing: 0.3, whiteSpace: 'nowrap' }}>{label}</span>
    );

    const StatCard = ({ label, value, sub, color }) => (
      <div style={{ background: '#fff', borderRadius: 12, padding: '18px 20px', border: '1px solid #e8ecf1', position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', top: 0, left: 0, width: 4, height: '100%', background: color, borderRadius: '12px 0 0 12px' }} />
        <div style={{ fontSize: 11, fontWeight: 600, color: '#8896a7', textTransform: 'uppercase', letterSpacing: 0.8, marginBottom: 6 }}>{label}</div>
        <div style={{ fontSize: 28, fontWeight: 700, color: '#0f1b2d', lineHeight: 1 }}>{value}</div>
        {sub && <div style={{ fontSize: 11, color: '#8896a7', marginTop: 5 }}>{sub}</div>}
      </div>
    );

    const fmt = {
      date: (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—',
      datetime: (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—',
    };

    const emStatusColor = (s) => s === 'sent' ? '#10b981' : s === 'failed' ? '#ef4444' : s === 'scheduled' ? '#3b82f6' : '#6b7280';
    const emCampaignLabel = (t) => ({ welcome: 'Welcome', monthly: 'Newsletter', review_request: 'Review Ask', seasonal: 'Seasonal', reengagement: 'Re-engage', custom: 'Custom' }[t] || t);

    const thStyle = { textAlign: 'left', padding: '8px 10px', color: '#8896a7', fontWeight: 600, fontSize: 11, textTransform: 'uppercase', letterSpacing: 0.5 };
    const cellStyle = { padding: '11px 10px', fontSize: 13, color: '#3d4f63' };
    const card = { background: '#fff', borderRadius: 14, border: '1px solid #e8ecf1', padding: 24 };

    // ─── Contacts Tab ─────────────────────────────────────
    const ContactsTab = ({ emClient }) => {
      const [contacts, setContacts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [uploading, setUploading] = useState(false);
      const [csvError, setCsvError] = useState('');
      const [toast, setToast] = useState('');
      const [search, setSearch] = useState('');
      const fileRef = useRef(null);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };

      useEffect(() => {
        portalFetch('/contacts').then(setContacts).catch(console.error).finally(() => setLoading(false));
      }, []);

      function parseCSV(text) {
        const lines = text.trim().split('\n').filter(l => l.trim());
        if (lines.length < 2) throw new Error('CSV needs a header row and at least one data row.');
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['"]/g, ''));
        const emailIdx = headers.findIndex(h => h === 'email');
        const firstIdx = headers.findIndex(h => h === 'first_name' || h === 'firstname' || h === 'first');
        const phoneIdx = headers.findIndex(h => h === 'phone' || h === 'phone_number');
        if (emailIdx === -1) throw new Error('CSV must have an "email" column.');
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
          const email = cols[emailIdx];
          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) continue;
          rows.push({ first_name: firstIdx >= 0 ? (cols[firstIdx] || '') : '', email, phone: phoneIdx >= 0 ? (cols[phoneIdx] || '') : '' });
        }
        return rows;
      }

      async function handleFileChange(e) {
        const file = e.target.files[0];
        if (!file) return;
        setCsvError('');
        setUploading(true);
        try {
          const text = await file.text();
          const parsed = parseCSV(text);
          if (parsed.length === 0) throw new Error('No valid email addresses found in CSV.');
          const result = await portalFetch('/contacts/bulk', { method: 'POST', body: { contacts: parsed } });
          const fresh = await portalFetch('/contacts');
          setContacts(fresh);
          showToast(`Imported ${result.imported} contacts ✓`);
        } catch (err) { setCsvError(err.message); }
        finally { setUploading(false); if (e.target) e.target.value = ''; }
      }

      async function handleUnsubscribe(contact) {
        if (!confirm(`Remove ${contact.email} from your list?`)) return;
        try {
          await portalFetch(`/contacts/${contact.id}/unsubscribe`, { method: 'POST' });
          setContacts(c => c.map(x => x.id === contact.id ? { ...x, status: 'unsubscribed' } : x));
          showToast('Contact removed ✓');
        } catch { showToast('Failed — try again.'); }
      }

      const subscribed = contacts.filter(c => c.status === 'subscribed').length;
      const visible = contacts.filter(c =>
        !search || c.email.includes(search) || (c.first_name || '').toLowerCase().includes(search.toLowerCase())
      );

      if (loading) return <Spinner />;

      return (
        <div>
          {toast && <div style={{ position: 'fixed', bottom: 24, right: 24, background: '#0f1b2d', color: '#fff', padding: '12px 20px', borderRadius: 10, fontSize: 13, fontWeight: 600, zIndex: 9999, boxShadow: '0 4px 20px rgba(0,0,0,0.2)' }}>{toast}</div>}

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 20 }}>
            <StatCard label="Total Contacts" value={contacts.length} color={EM_PURPLE} />
            <StatCard label="Subscribed" value={subscribed} color="#10b981" />
            <StatCard label="Unsubscribed" value={contacts.length - subscribed} color="#6b7280" sub={`Limit: ${emClient.contact_limit?.toLocaleString()}`} />
          </div>

          <div style={{ ...card, marginBottom: 16 }}>
            <h3 style={{ fontSize: 14, fontWeight: 700, color: '#0f1b2d', margin: '0 0 6px' }}>Upload Contact List</h3>
            <p style={{ fontSize: 13, color: '#8896a7', margin: '0 0 14px' }}>CSV columns: <strong>email</strong> (required), first_name, phone. Duplicates are skipped automatically.</p>
            <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
              <button onClick={() => fileRef.current && fileRef.current.click()} disabled={uploading}
                style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '9px 18px', borderRadius: 9, border: 'none', cursor: 'pointer', background: EM_PURPLE, color: '#fff', fontSize: 13, fontWeight: 600, opacity: uploading ? 0.7 : 1 }}>
                ↑ {uploading ? 'Importing…' : 'Choose CSV File'}
              </button>
              <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={handleFileChange} style={{ display: 'none' }} />
              <span style={{ fontSize: 12, color: '#adb5c2' }}>{contacts.length} / {emClient.contact_limit} contacts used</span>
            </div>
            {csvError && <div style={{ marginTop: 10, background: '#fef2f2', border: '1px solid #fecaca', borderRadius: 8, padding: '9px 13px', fontSize: 13, color: '#dc2626' }}>{csvError}</div>}
          </div>

          <div style={card}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
              <h3 style={{ fontSize: 14, fontWeight: 700, color: '#0f1b2d', margin: 0 }}>Contact List ({contacts.length})</h3>
              <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search…"
                style={{ padding: '7px 12px', borderRadius: 8, border: '1px solid #d4d9e0', fontSize: 13, outline: 'none', width: 180 }} />
            </div>
            {contacts.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '40px 24px', color: '#adb5c2' }}>
                <div style={{ fontSize: 36, marginBottom: 10 }}>📭</div>
                <div style={{ fontSize: 14, fontWeight: 500 }}>No contacts yet — upload a CSV to get started.</div>
              </div>
            ) : (
              <div style={{ overflowX: 'auto' }}>
                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                  <thead>
                    <tr style={{ borderBottom: '2px solid #f0f2f5' }}>
                      {['Name', 'Email', 'Phone', 'Status', 'Added', ''].map(h => <th key={h} style={thStyle}>{h}</th>)}
                    </tr>
                  </thead>
                  <tbody>
                    {visible.map(c => (
                      <tr key={c.id} style={{ borderBottom: '1px solid #f5f6f8' }}>
                        <td style={{ ...cellStyle, fontWeight: 600, color: '#0f1b2d' }}>{c.first_name || '—'}</td>
                        <td style={cellStyle}>{c.email}</td>
                        <td style={cellStyle}>{c.phone || '—'}</td>
                        <td style={cellStyle}><Badge label={c.status} color={c.status === 'subscribed' ? '#10b981' : '#6b7280'} /></td>
                        <td style={cellStyle}>{fmt.date(c.created_at)}</td>
                        <td style={{ padding: '11px 10px' }}>
                          {c.status === 'subscribed' && (
                            <button onClick={() => handleUnsubscribe(c)}
                              style={{ padding: '5px 12px', borderRadius: 7, border: '1px solid #fecaca', cursor: 'pointer', background: '#fff', color: '#ef4444', fontSize: 11, fontWeight: 600 }}>
                              Remove
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    };

    // ─── Campaigns Tab ────────────────────────────────────
    const CampaignsTab = () => {
      const [campaigns, setCampaigns] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        portalFetch('/campaigns').then(setCampaigns).catch(console.error).finally(() => setLoading(false));
      }, []);

      if (loading) return <Spinner />;

      return (
        <div style={card}>
          <div style={{ marginBottom: 16 }}>
            <h3 style={{ fontSize: 14, fontWeight: 700, color: '#0f1b2d', margin: '0 0 4px' }}>All Campaigns</h3>
            <p style={{ fontSize: 13, color: '#8896a7', margin: 0 }}>Your monthly campaigns are auto-generated and scheduled. Use Custom Campaign for one-offs.</p>
          </div>
          {campaigns.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '40px 24px', color: '#adb5c2' }}>
              <div style={{ fontSize: 36, marginBottom: 10 }}>📬</div>
              <div style={{ fontSize: 14, fontWeight: 500 }}>No campaigns yet — they'll appear here once scheduled.</div>
            </div>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                <thead>
                  <tr style={{ borderBottom: '2px solid #f0f2f5' }}>
                    {['Type', 'Subject', 'Scheduled', 'Sent', 'Status'].map(h => <th key={h} style={thStyle}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {campaigns.map(c => (
                    <tr key={c.id} style={{ borderBottom: '1px solid #f5f6f8' }}>
                      <td style={cellStyle}><Badge label={emCampaignLabel(c.campaign_type)} color={EM_PURPLE} /></td>
                      <td style={{ ...cellStyle, fontWeight: 600, color: '#0f1b2d', maxWidth: 260 }}>{c.subject}</td>
                      <td style={cellStyle}>{fmt.datetime(c.scheduled_at)}</td>
                      <td style={cellStyle}>{c.sent_at ? fmt.datetime(c.sent_at) : '—'}</td>
                      <td style={cellStyle}><Badge label={c.status} color={emStatusColor(c.status)} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    };

    // ─── Custom Campaign Tab ──────────────────────────────
    const CustomCampaignTab = ({ emClient }) => {
      const [prompt, setPrompt] = useState('');
      const [generating, setGenerating] = useState(false);
      const [preview, setPreview] = useState(null);
      const [scheduling, setScheduling] = useState(false);
      const [scheduled, setScheduled] = useState(false);
      const [toast, setToast] = useState('');

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3500); };

      async function handleGenerate() {
        if (!prompt.trim()) return;
        setGenerating(true);
        setPreview(null);
        setScheduled(false);
        try {
          const result = await portalFetch('/campaigns/generate', { method: 'POST', body: { prompt } });
          setPreview(result);
        } catch (err) { showToast('Generation failed: ' + err.message); }
        finally { setGenerating(false); }
      }

      async function handleSchedule() {
        if (!preview) return;
        setScheduling(true);
        try {
          await portalFetch('/campaigns/schedule', { method: 'POST', body: preview });
          setScheduled(true);
          showToast('Campaign scheduled ✓');
        } catch (err) { showToast('Failed to schedule: ' + err.message); }
        finally { setScheduling(false); }
      }

      return (
        <div>
          {toast && <div style={{ position: 'fixed', bottom: 24, right: 24, background: '#0f1b2d', color: '#fff', padding: '12px 20px', borderRadius: 10, fontSize: 13, fontWeight: 600, zIndex: 9999, boxShadow: '0 4px 20px rgba(0,0,0,0.2)' }}>{toast}</div>}

          <div style={{ ...card, marginBottom: 16 }}>
            <h3 style={{ fontSize: 14, fontWeight: 700, color: '#0f1b2d', margin: '0 0 6px' }}>Describe Your Campaign</h3>
            <p style={{ fontSize: 13, color: '#8896a7', margin: '0 0 14px' }}>Tell us what you want to send. Mention any promotions, seasons, or goals — the more specific, the better the result.</p>
            <textarea
              value={prompt}
              onChange={e => setPrompt(e.target.value)}
              placeholder={"e.g. Running a summer special — 15% off all roof inspections booked in June. Want to drive urgency before the rainy season hits."}
              style={{ width: '100%', minHeight: 100, padding: '11px 14px', borderRadius: 10, border: '1px solid #d4d9e0', fontSize: 13, outline: 'none', resize: 'vertical', fontFamily: 'inherit', lineHeight: 1.6, boxSizing: 'border-box' }}
            />
            <button onClick={handleGenerate} disabled={generating || !prompt.trim()}
              style={{ marginTop: 12, padding: '10px 22px', borderRadius: 9, border: 'none', cursor: 'pointer', background: EM_PURPLE, color: '#fff', fontSize: 13, fontWeight: 700, opacity: (generating || !prompt.trim()) ? 0.6 : 1 }}>
              {generating ? 'Generating…' : '✦ Generate Campaign'}
            </button>
          </div>

          {preview && (
            <div style={card}>
              <h3 style={{ fontSize: 14, fontWeight: 700, color: '#0f1b2d', margin: '0 0 20px', paddingBottom: 14, borderBottom: '1px solid #f0f2f5' }}>Campaign Preview</h3>

              {[
                { label: 'Subject Line', value: preview.subject, big: true },
                { label: 'Preview Text', value: preview.preview },
              ].map(({ label, value, big }) => (
                <div key={label} style={{ marginBottom: 18 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: '#8896a7', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 5 }}>{label}</div>
                  <div style={{ fontSize: big ? 20 : 14, fontWeight: big ? 700 : 400, color: '#0f1b2d', lineHeight: 1.45 }}>{value}</div>
                </div>
              ))}

              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: '#8896a7', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 8 }}>Email Body</div>
                <div style={{ background: '#f8f9fb', borderRadius: 10, padding: '16px 18px', fontSize: 14, color: '#374151', lineHeight: 1.75 }}>{preview.body}</div>
              </div>

              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: '#8896a7', textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 8 }}>CTA Button</div>
                <span style={{ display: 'inline-block', background: EM_PURPLE, color: '#fff', padding: '9px 22px', borderRadius: 8, fontSize: 13, fontWeight: 700 }}>{preview.cta}</span>
              </div>

              {scheduled ? (
                <div style={{ background: '#f0fdf4', border: '1px solid #86efac', borderRadius: 10, padding: '13px 16px', fontSize: 13, color: '#166534', fontWeight: 600 }}>
                  ✓ Campaign scheduled — it will send to your subscribed contacts within 5 minutes.
                </div>
              ) : (
                <div style={{ display: 'flex', gap: 10 }}>
                  <button onClick={handleSchedule} disabled={scheduling}
                    style={{ padding: '10px 22px', borderRadius: 9, border: 'none', cursor: 'pointer', background: '#10b981', color: '#fff', fontSize: 13, fontWeight: 700, opacity: scheduling ? 0.7 : 1 }}>
                    {scheduling ? 'Scheduling…' : '✓ Approve & Send'}
                  </button>
                  <button onClick={() => setPreview(null)}
                    style={{ padding: '10px 18px', borderRadius: 9, border: '1px solid #d4d9e0', cursor: 'pointer', background: '#fff', color: '#3d4f63', fontSize: 13, fontWeight: 600 }}>
                    Regenerate
                  </button>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // ─── Main Portal App ──────────────────────────────────
    function PortalApp() {
      const [state, setState] = useState('loading'); // loading | invalid | ready
      const [emClient, setEmClient] = useState(null);
      const [subTab, setSubTab] = useState('contacts');

      useEffect(() => {
        const token = getToken();
        if (!token) { setState('invalid'); return; }
        portalFetch('/verify')
          .then(client => { setEmClient(client); setState('ready'); })
          .catch(() => setState('invalid'));
      }, []);

      if (state === 'loading') return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Spinner />
        </div>
      );

      if (state === 'invalid') return (
        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ background: '#fff', borderRadius: 16, padding: '48px 40px', maxWidth: 420, width: '100%', textAlign: 'center', border: '1px solid #e8ecf1', boxShadow: '0 4px 24px rgba(0,0,0,0.06)' }}>
            <div style={{ fontSize: 40, marginBottom: 16 }}>🔒</div>
            <div style={{ fontSize: 18, fontWeight: 700, color: '#0f1b2d', marginBottom: 10 }}>Invalid or expired link</div>
            <div style={{ fontSize: 13, color: '#8896a7', marginBottom: 24 }}>This portal link may have expired. Contact Brechtland to get a fresh access link.</div>
            <a href="mailto:tyler@brechtland.com" style={{ display: 'inline-block', padding: '10px 22px', borderRadius: 9, background: '#0f1b2d', color: '#fff', fontWeight: 700, fontSize: 13, textDecoration: 'none' }}>
              Contact Support
            </a>
          </div>
        </div>
      );

      const tierLabel = emClient.tier ? emClient.tier.charAt(0).toUpperCase() + emClient.tier.slice(1) : '';

      return (
        <div style={{ minHeight: '100vh', background: '#f3f5f8' }}>
          {/* Header */}
          <div style={{ background: '#0f1b2d', padding: '0 32px' }}>
            <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 60 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                <div style={{ fontSize: 16, fontWeight: 700, letterSpacing: 1.5, color: '#fff' }}>BRECHTLAND</div>
                <div style={{ width: 1, height: 18, background: 'rgba(255,255,255,0.15)' }} />
                <div style={{ fontSize: 13, color: '#5c7a9a', fontWeight: 500 }}>Email Marketing Portal</div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ width: 32, height: 32, borderRadius: 8, background: EM_PURPLE, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#fff' }}>
                  {(emClient.business_name || '??').charAt(0).toUpperCase()}
                </div>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: '#fff', whiteSpace: 'nowrap' }}>{emClient.business_name}</div>
                  <div style={{ fontSize: 10, color: '#5c7a9a' }}>{tierLabel} Plan</div>
                </div>
              </div>
            </div>
          </div>

          {/* Content */}
          <div style={{ maxWidth: 1100, margin: '0 auto', padding: '32px 32px' }}>
            <div style={{ marginBottom: 24 }}>
              <h1 style={{ fontSize: 22, fontWeight: 700, color: '#0f1b2d', margin: '0 0 4px' }}>Email Marketing</h1>
              <p style={{ fontSize: 13, color: '#8896a7', margin: 0 }}>
                {emClient.campaigns_per_month} campaigns/mo · {emClient.contact_limit?.toLocaleString()} contact limit
              </p>
            </div>

            {/* Sub-tabs */}
            <div style={{ display: 'flex', gap: 8, marginBottom: 24 }}>
              {[['contacts', 'Contacts'], ['campaigns', 'Campaigns'], ['custom', 'Custom Campaign']].map(([id, label]) => (
                <button key={id} onClick={() => setSubTab(id)} style={{
                  padding: '8px 18px', borderRadius: 9, border: '1px solid',
                  background: subTab === id ? '#0f1b2d' : '#fff',
                  color: subTab === id ? '#fff' : '#3d4f63',
                  borderColor: subTab === id ? '#0f1b2d' : '#d4d9e0',
                  fontSize: 13, fontWeight: 600, cursor: 'pointer', transition: 'all 0.15s',
                }}>{label}</button>
              ))}
            </div>

            {subTab === 'contacts' && <ContactsTab emClient={emClient} />}
            {subTab === 'campaigns' && <CampaignsTab />}
            {subTab === 'custom' && <CustomCampaignTab emClient={emClient} />}
          </div>

          {/* Footer */}
          <div style={{ borderTop: '1px solid #e8ecf1', padding: '20px 32px', textAlign: 'center', marginTop: 40 }}>
            <div style={{ fontSize: 12, color: '#adb5c2' }}>
